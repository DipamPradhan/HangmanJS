<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONE PIECE HANGMAN</title>
    <link rel="stylesheet" href="./style.css?v=2" />
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Rock+Salt&family=Rowdies:wght@300;400;700&family=Rubik+Mono+One&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="icon" href="./images/logoFinal2.png" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/logoFinal2.png" />
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./images/logoFinal2.png"
  />
  <link rel="mask-icon" href="./images/logoFinal2.png" color="#4deeea" />
  <body>
    <div class="bg-art" aria-hidden="true">
      <img
        src="./onepiece-images/crew on luffy.png"
        alt=""
        class="bg-art-img bg-art-left"
      />

      <img
        src="./onepiece-images/shipp.png"
        alt=""
        class="bg-art-img bg-art-bottom"
      />
    </div>
    <div id="overlay">
      <div class="header">
        <img
          src="./onepiece-images/logo.png"
          alt="One Piece logo"
          class="title-logo"
        />
        <h1>ONE PIECE HANGMAN</h1>
      </div>

      <div class="upperContainer">
        <div class="hangmanImage">
          <img
            src="./images/hangman-0.svg"
            alt="hangmanImage"
            id="hangmanImage"
          />
        </div>
        <div class="word">
          <ul id="word"></ul>
        </div>
      </div>

      <div class="container">
        <div class="contents">
          <div class="incorrectGuess">
            Incorrect <span id="guess">Guesses</span>
            <span id="incorrectGuess">: 0/6</span>
          </div>

          <div class="hint" id="hint"></div>
        </div>
        <div class="keyboard" id="keyboard"></div>
      </div>
    </div>
    <div class="generate">
      <button id="generateWord">
        <i class="fa-solid fa-rotate"></i>
        <span>Generate Word</span>
      </button>
    </div>
    <div class="notGenerated" id="notGenerated">
      <h2>Set sail! Click on Generate Word to start the game</h2>
    </div>
    <div class="answer" id="correctAnswer">
      <h2>Congratulations, Straw Hat!</h2>
      <h2>You have guessed the correct word</h2>
      <h2 style="color: #2e9e44">
        Answer:
        <span id="answerW" style="text-transform: uppercase"></span>
      </h2>
      <button id="playAgainW" class="playAgain">Play Again</button>
    </div>
    <div class="answer" id="incorrectAnswer">
      <h2>Try Again, Captain!</h2>
      <h2>You couldn't guess the correct word</h2>
      <h2 style="color: #e63946">
        Answer:
        <span id="answerL" style="text-transform: uppercase"></span>
      </h2>
      <button id="playAgainL" class="playAgain">Play Again</button>
    </div>
    <script src="./word-list.js?v=2"></script>
    <script src="./script.js?v=2"></script>
  </body>
</html>
